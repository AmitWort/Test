<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דרך ישראל - מפת ניווט ומסלולים בזמן אמת</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    <!-- FontAwesome לאייקונים -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --primary-color: #007aff;
            --primary-light: #e3f2fd;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --bg-white: #ffffff;
            --border-color: #e0e0e0;
            --shadow: 0 4px 12px rgba(0,0,0,0.15);
            --sidebar-width: 380px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* חלונית צדדית */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-white);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .sidebar.collapsed {
            transform: translateX(100%);
        }

        .brand-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
        }

        .brand-header h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-white);
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 16px;
        }

        .input-group.destination i {
            color: #e74c3c;
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 2px solid #f0f2f5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f0f2f5;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            background-color: white;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }

        .btn-route { background-color: var(--primary-color); }
        .btn-gps { background-color: #2ecc71; }

        .btn-action:hover { opacity: 0.9; }

        /* כפתורי דיווח מהיר */
        .report-section {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .report-section h3 {
            font-size: 14px;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .report-grid {
            display: grid;
            grid-template-columns: 1xl 1fr;
            gap: 10px;
        }

        .btn-report {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
        }

        .btn-report.traffic { color: #e67e22; border-color: #e67e22; }
        .btn-report.accident { color: #e74c3c; border-color: #e74c3c; }

        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .route-summary {
            background: var(--primary-light);
            padding: 16px;
            border-radius: 12px;
            border-right: 4px solid var(--primary-color);
            display: none;
        }

        .route-time { font-size: 26px; font-weight: 700; color: var(--text-dark); }

        /* מפה */
        .map-container { flex: 1; height: 100%; position: relative; }
        #map { width: 100%; height: 100%; }

        .toggle-sidebar {
            position: absolute; left: -30px; top: 50%; transform: translateY(-50%);
            width: 30px; height: 60px; background: white; border-radius: 8px 0 0 8px;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1); display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 1001; border: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 45vh; position: absolute; bottom: 0; left: 0; right: 0; border-radius: 20px 20px 0 0; }
            .sidebar.collapsed { transform: translateY(calc(45vh - 60px)); }
            .map-container { height: 55vh; width: 100%; }
            .toggle-sidebar { left: 50%; top: -20px; transform: translateX(-50%) rotate(90deg); width: 50px; height: 25px; border-radius: 8px 8px 0 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <aside class="sidebar" id="sidebar">
            <div class="toggle-sidebar" id="toggleBtn" onclick="toggleSidebar()">
                <i class="fa-solid fa-chevron-right" id="toggleIcon"></i>
            </div>

            <div class="brand-header">
                <i class="fa-solid fa-location-arrow"></i>
                <h1>דרך ישראל</h1>
            </div>

            <div class="search-container">
                <button class="btn-action btn-gps" onclick="getLocationWithGPS()">
                    <i class="fa-solid fa-crosshairs"></i>
                    נווט מהמיקום הנוכחי שלי (GPS)
                </button>
                
                <div class="input-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" class="search-input" id="startInput" placeholder="נקודת מוצא (למשל: תל אביב)">
                </div>
                <div class="input-group destination">
                    <i class="fa-solid fa-flag-checkered"></i>
                    <input type="text" class="search-input" id="endInput" placeholder="לאן נוסעים? (למשל: ירושלים)">
                </div>
                <button class="btn-action btn-route" onclick="calculateRoute()">
                    <i class="fa-solid fa-route"></i>
                    מצא מסלול מהיר
                </button>
            </div>

            <!-- אזור דיווחים מהירים -->
            <div class="report-section">
                <h3>דיווח מהיר על המפה (לחץ על כפתור ואז לחץ על המפה):</h3>
                <div class="report-grid">
                    <button class="btn-report traffic" onclick="setReportMode('traffic')">
                        <i class="fa-solid fa-car-burst"></i> פקק תנועה
                    </button>
                    <button class="btn-report accident" onclick="setReportMode('accident')">
                        <i class="fa-solid fa-triangle-exclamation"></i> תאונה
                    </button>
                </div>
            </div>

            <div class="results-container">
                <div class="route-summary" id="routeSummary">
                    <div class="route-time" id="summaryTime">-- דקות</div>
                    <div class="route-meta" id="summaryDetails">מחשב מסלול אופטימלי...</div>
                </div>
                <div id="infoMessage" style="color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 10px;">
                    ניתן ללחוץ ישירות על המפה כדי להוסיף סמני תאונות ופקקים בזמן אמת!
                </div>
            </div>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com" crossorigin=""></script>
    
    <script>
        // אתחול המפה
        const map = L.map('map', { zoomControl: false }).setView([32.0853, 34.7818], 10);

        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 20
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        let currentRouteLine = null;
        let startMarker = null;
        let endMarker = null;
        let userLiveLocation = null;
        let activeReportMode = null; // 'traffic' או 'accident'

        const geoDatabase = {
            "תל אביב": [32.0853, 34.7818],
            "ירושלים": [31.7683, 35.2137],
            "חיפה": [32.7940, 34.9896],
            "באר שבע": [31.2529, 34.7915]
        };
