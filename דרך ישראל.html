<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>דרך ישראל - מפת ניווט ומסלולים בזמן אמת</title>
    
    <!-- Leaflet CSS - ספריית מפות מקצועית וקלה -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    <!-- FontAwesome - אייקונים וקטוריים מתקדמים לממשק הניווט -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* הגדרת משתני עיצוב קבועים (CSS Variables) בסגנון Live Map מקצועי */
        :root {
            --primary-color: #007aff;
            --primary-light: #e3f2fd;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --bg-white: #ffffff;
            --border-color: #e0e0e0;
            --shadow: 0 4px 12px rgba(0,0,0,0.15);
            --sidebar-width: 380px;
        }

        /* איפוס הגדרות בסיסיות */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        /* מיכל האפליקציה הראשי במסך מלא */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* חלונית צדדית אינטראקטיבית - Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-white);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* מצב חלונית צד מכווצת (מוסתרת מהמסך) */
        .sidebar.collapsed {
            transform: translateX(100%);
        }

        /* כותרת מיתוג ייחודית - דרך ישראל */
        .brand-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
        }

        .brand-header i {
            font-size: 24px;
        }

        .brand-header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* קונטיינר שדות חיפוש */
        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-white);
        }

        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-group i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 16px;
        }

        /* שינוי אייקון היעד לצבע אדום התרעתי */
        .input-group.destination i {
            color: #e74c3c;
        }

        .search-input {
            width: 100%;
            padding: 12px 40px 12px 12px;
            border: 2px solid #f0f2f5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f0f2f5;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
        }

        /* כפתור הגשת הניווט */
        .btn-route {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0, 122, 255, 0.3);
        }

        .btn-route:hover {
            background-color: #0056b3;
        }

        .btn-route:active {
            transform: scale(0.98);
        }

        /* אזור תוצאות ומסלולים חלופיים */
        .results-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .route-summary {
            background: var(--primary-light);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-right: 4px solid var(--primary-color);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .route-time {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .route-meta {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* אזור המפה המרכזי התופס את שאר המסך */
        .map-container {
            flex: 1;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* כפתור צף לפתיחה וכיווץ חלונית הצד */
        .toggle-sidebar {
            position: absolute;
            left: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 60px;
            background: white;
            border-radius: 8px 0 0 8px;
            box-shadow: -2px 0 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1001;
            border: 1px solid var(--border-color);
            border-left: none;
        }

        /* שכבת דיווחים צפים מעל המפה בזמן אמת */
        .floating-alerts {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: white;
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* אפקט נקודה פועמת לסימולציית אונליין */
        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 0 6px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* חוקי רספונסיביות קשוחים עבור סמארטפונים וטאבלטים (Mobile First CSS Override) */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column-reverse; /* המפה עולה למעלה, תיבת החיפוש יורדת כלפי מטה כמגירה */
            }

            .sidebar {
                width: 100%;
                height: 40vh;
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -4px 15px rgba(0,0,0,0.15);
                transform: translateY(0);
            }

            .sidebar.collapsed {
                transform: translateY(calc(40vh - 60px)); /* כיווץ כלפי מטה במקום הצידה במובייל */
            }

            .map-container {
                height: 60vh;
                width: 100%;
            }

            .toggle-sidebar {
                left: 50%;
                top: -20px;
                transform: translateX(-50%) rotate(90deg); /* סיבוב הכפתור שיתאים להחלקה למטה */
                width: 50px;
                height: 25px;
                border-radius: 8px 8px 0 0;
            }

            .brand-header {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- חלונית ניווט וחיפוש (Sidebar) -->
        <aside class="sidebar" id="sidebar">
            <div class="toggle-sidebar" id="toggleBtn" onclick="toggleSidebar()">
                <i class="fa-solid fa-chevron-right" id="toggleIcon"></i>
            </div>

            <div class="brand-header">
                <i class="fa-solid fa-location-arrow"></i>
                <h1>דרך ישראל</h1>
            </div>

            <div class="search-container">
                <div class="input-group">
                    <i class="fa-solid fa-location-dot"></i>
                    <input type="text" class="search-input" id="startInput" placeholder="נקודת מוצא (למשל: תל אביב)">
                </div>
                <div class="input-group destination">
                    <i class="fa-solid fa-flag-checkered"></i>
                    <input type="text" class="search-input" id="endInput" placeholder="לאן נוסעים? (למשל: ירושלים)">
                </div>
                <button class="btn-route" onclick="calculateRoute()">
                    <i class="fa-solid fa-route"></i>
                    מצא מסלול מהיר
                </button>
            </div>

            <div class="results-container">
                <div class="route-summary" id="routeSummary">
                    <div class="route-time" id="summaryTime">-- דקות</div>
